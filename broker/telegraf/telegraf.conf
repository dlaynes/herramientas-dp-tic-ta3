# Telegraf: puente entre el broker MQTT (EMQX) y la base de datos InfluxDB

[agent]
  interval = "5s"
  flush_interval = "5s"
  omit_hostname = true
  skip_processors_after_aggregators = false

# Entrada: se suscribe a las mediciones de todos los sensores
[[inputs.mqtt_consumer]]
  # Red interna de Docker: se usa el nombre del servicio, no localhost
  servers = ["tcp://emqx:1883"]
  topics = ["iot/+/mediciones"]
  qos = 1
  client_id = "telegraf_influxdb"
  username = "${TELEGRAF_MQTT_USERNAME}"
  password = "${TELEGRAF_MQTT_PASSWORD}"
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "mediciones"
    # Se usa la hora de la lectura del sensor, no la de llegada
    timestamp_path = "timestamp"
    timestamp_format = "2006-01-02T15:04:05Z07:00"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "sensor_id"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "ubicacion"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "temperatura"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "humedad"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "presion"
      type = "float"

# Salida: escribe en el bucket "sensores" de InfluxDB
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "iot"
  bucket = "sensores"
